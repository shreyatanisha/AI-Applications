services:
  - type: web
    name: career-counsellor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn second:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10
